name: 골프장 목록 갱신
on:
  workflow_dispatch:
  schedule:
    - cron: '0 18 1 * *'
  push:
    branches: [main]
    paths: ['scripts/build-clubs.mjs', '.github/workflows/clubs.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/build-clubs.mjs
      - name: 바뀐 목록 올리기
        run: |
          git config user.name "happy-caddy-bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/data/clubs.json
          git diff --cached --quiet || (git commit -m "골프장 목록 갱신" && git pull --rebase origin main && git push)
