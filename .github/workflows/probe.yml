name: 점검
on:
  push:
    branches: [main]
    paths: ['scripts/probe.mjs']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/probe.mjs > probe-out.txt 2>&1 || true
      - run: |
          git config user.name "happy-caddy-bot"; git config user.email "actions@users.noreply.github.com"
          git checkout -b probe-out && git add -f probe-out.txt && git commit -m probe && git push -f origin probe-out
